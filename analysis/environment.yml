name: matsim-py
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.13
  # Core
  - numpy>=1.26
  - pandas>=2.0
  - scipy>=1.11
  # Plotting
  - matplotlib>=3.7
  - seaborn>=0.13
  # Geospatial (binary packages — much easier than pip on Windows)
  - geopandas>=0.14
  - shapely>=2.0
  - pyproj>=3.6
  - gdal>=3.7            # provides osgeo.gdal used in 2.2
  - rasterio>=1.3
  # Statistics
  - statsmodels>=0.14
  # Misc
  - pip
  - pip:
      # pyecharts + snapshot-selenium are pure-python / data only – safe via pip
      - pyecharts>=2.0
      - snapshot-selenium>=0.0.2
      # selenium itself is required by snapshot-selenium; let pip pick the latest
      - selenium>=4.10
# Optional local module:
#   analysis/6.1 model validation for Nanjing.py does `import CoordinatesConverter as cc`.
#   CoordinatesConverter is a project-local helper, NOT in the requirements file.
#   Drop it under analysis/ (or any directory on sys.path) before running that script.